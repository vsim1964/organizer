<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <label for="taskTitle">Название задачи</label>

      <input
        type="text"
        name="title"
        id="taskTitle"
        required
      />
      <button type="submit">Coхранить</button>

      <textarea
        name="description"
        id="taskDescription"
        rows="4"
      ></textarea>

      <label for="taskPriority"></label>
      <select
        name="priority"
        id="taskPriority"
      >
        <option value="low">Низкий</option>
        <option value="medium">Средний</option>
        <option value="high">Высокий</option>
      </select>
    </form>

    <!-- <button type="submit" form="taskForm">Сохранить</button> -->
  </body>
</html>
